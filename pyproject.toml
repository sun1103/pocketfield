[project]
name = "pocketfield"
version = "0.1.0"
description = "Probe-based spherical interaction fields for pocket-conditioned molecule generation."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
pocketfield = "pocketfield.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
